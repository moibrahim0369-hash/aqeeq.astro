    function matrixCalc(d, m, y) {
      const A = redArc(d), B = redArc(m), C = redArc(y), D = redArc(A + B + C), E = redArc(A + B + C + D);
      const P = { A, B, C, D, E, F: redArc(A + B), G: redArc(B + C), H: redArc(C + D), I: redArc(D + A) };
      ["A", "B", "C", "D", "F", "G", "H", "I"].forEach(k => { P[k + "2"] = redArc(P[k] + E); });
      P.mid = OUTER.map((k, i) => redArc(P[k] + P[OUTER[(i + 1) % 8]]));
      P.sky = redArc(B + D); P.earth = redArc(A + C); P.self = redArc(P.sky + P.earth);
      P.year = redArc(A + B + redArc(digSum(new Date().getFullYear())));
      return P;
    }

    function lifePath(d, m, y) {
      let n = digSum(d) + digSum(m) + digSum(y);
      while (n > 9 && ![11, 22, 33].includes(n)) n = digSum(n);
      return n;
    }

    function ageNow(d, m, y) {
      const t = new Date(); let a = t.getFullYear() - y;
      if (t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) a--;
      return a;
    }

  const _arcanaCache = {};
  async function loadArcana(n) {
    if (_arcanaCache[n]) return _arcanaCache[n];
    try {
      const r = await fetch(`assets/data/matrix/arcana-${String(n).padStart(2,"0")}.json`);
      if (!r.ok) return null;
      const data = await r.json();
      _arcanaCache[n] = data;
      return data;
    } catch { return null; }
  }

    if (!data) return `<p class="mx-acc-loading">تعذّر تحميل المحتوى</p>`;

    if (!pos) {

      return `

        </div>`;
    }
    let html = `<div class="mx-acc-body">`;
    if (data.openingShock) html += `<p class="mx-acc-opening">${data.openingShock}</p>`;
    if (pos.psychology || pos.label) html += `<div class="mx-acc-block mx-block-gold"><h5>${pos.label || "النفسية"}</h5><p>${pos.psychology || pos.purpose || pos.positive || ""}</p>${pos.gift ? `<p class="mx-gift">🎁 ${pos.gift}</p>` : ""}${pos.shadowTrap ? `<p class="mx-shadow">⚡ ${pos.shadowTrap}</p>` : ""}</div>`;
    if (pos.positive && !pos.psychology) html += `<div class="mx-acc-block mx-block-gold"><h5>الإيجابي</h5><p>${pos.positive}</p></div>`;
    if (pos.negative) html += `<div class="mx-acc-block mx-block-red"><h5>التحديات</h5><p>${pos.negative}</p></div>`;
    if (pos.unlock) html += `<div class="mx-acc-block mx-block-teal"><h5>مفتاح التفعيل</h5><p>${pos.unlock}</p></div>`;
    if (pos.patterns?.length) html += `<div class="mx-acc-block mx-block-red"><h5>أنماط متكررة</h5>${pos.patterns.map(p => `<p class="mx-pattern">▸ ${p}</p>`).join("")}</div>`;
    if (pos.pastLife) html += `<div class="mx-acc-block"><h5>من حياة سابقة</h5><p>${pos.pastLife}</p></div>`;
    if (pos.childhood) html += `<div class="mx-acc-block"><h5>أثر الطفولة</h5><p>${pos.childhood}</p></div>`;
    if (pos.presentFalls) html += `<div class="mx-acc-block mx-block-red"><h5>الأنماط الحالية</h5><p>${pos.presentFalls}</p></div>`;
    if (pos.purpose) html += `<div class="mx-acc-block mx-block-teal"><h5>الهدف الكوني</h5><p>${pos.purpose}</p></div>`;
    if (pos.cosmicTest) html += `<div class="mx-acc-block"><h5>الاختبار</h5><p>${pos.cosmicTest}</p></div>`;

    if (data.closingStatement) html += `<p class="mx-closing">"${data.closingStatement}"</p>`;
    html += `</div>`;

          <div class="mx-acc-block"><h5>خط الأب (F): ${F.n} · رقم ${P.F}</h5><p>${F.core}</p></div>
          <div class="mx-acc-block"><h5>خط الأم (I): ${ARC(P.I).n} · رقم ${P.I}</h5><p>${ARC(P.I).core}</p></div>
          <div class="mx-acc-block mx-block-red"><h5>الميراث العائلي (C): ${C_arc.n} · رقم ${P.C}</h5><p>${C_arc.shadow}</p></div>
          <div class="mx-acc-block mx-block-teal"><h5>التحرر من الأنماط</h5><p>${C_arc.release}</p></div>
        </div>`)}

      ${buildAccordion("children", "🌱", "الأطفال والنسل", numBadge(P.G)+" "+numBadge(P.D), `
        <div class="mx-acc-body">
          <p class="mx-acc-lead">طاقتك كوالد/والدة وما تنقله لمن يأتي بعدك</p>
          <div class="mx-acc-block"><h5>ما تُعطيه: ${G.n} · رقم ${P.G}</h5><p>${G.core}</p><p>${G.real}</p></div>
          <div class="mx-acc-block mx-block-red"><h5>ما قد تورّثه كارمياً: ${D_arc.n}</h5><p>${D_arc.shadow}</p></div>
          <div class="mx-acc-block mx-block-teal"><h5>كيف تكسر الحلقة</h5><p>${D_arc.release}</p></div>
        </div>`)}

      ${buildAccordion("relationships", "❤️", "العلاقات والشريك", numBadge(P.H)+" "+numBadge(P.D), `
        <div class="mx-acc-body">
          <p class="mx-acc-lead">أنماطك العاطفية وطبيعة علاقاتك وما تبحث عنه في شريك حياتك</p>
          <div class="mx-acc-block mx-block-gold"><h5>في الحب: ${H.n} · رقم ${P.H}</h5><p>${H.core}</p><p>${H.real}</p></div>
          <div class="mx-acc-block mx-block-red"><h5>الأنماط المتكررة: ${D_arc.n}</h5><p>${D_arc.shadow}</p></div>
          <div class="mx-acc-block mx-block-teal"><h5>ما يكسر الحلقة</h5><p>${H.release}</p></div>
          <div id="mx-relationships-deep" class="mx-deep-loader" data-nums="${P.H}"><p class="mx-acc-loading">⏳ جاري تحميل التحليل العميق...</p></div>
        </div>`)}

      ${buildAccordion("guidance", "🧭", "الإرشادات الحياتية", numBadge(P.E)+" "+numBadge(P.self||""), `
        <div class="mx-acc-body">
          <p class="mx-acc-lead">توجيهات عملية لحياة متوازنة وفق طاقة مصفوفتك</p>
          <div class="mx-acc-block mx-block-gold"><h5>من جوهرك: ${E.n}</h5><p>${E.core}</p></div>
          ${P.self ? `<div class="mx-acc-block"><h5>هدفك الشخصي: ${ARC(P.self).n} · رقم ${P.self}</h5><p>${ARC(P.self).core}</p><p>${ARC(P.self).release}</p></div>` : ""}
          <div class="mx-acc-block mx-block-teal"><h5>خطوة ابدأ بيها</h5><p>${E.release}</p></div>
          <div class="mx-acc-block"><h5>عادات الوعي اليومي</h5><p>راقب الأنماط المتكررة في حياتك. كل نمط هو رسالة من مصفوفتك.</p></div>
        </div>`)}

      ${buildAccordion("year", "📅", "توقعات السنة الحالية", numBadge(P.year)+" "+numBadge(lp, "red"), `${yearSection(P)}`)}

      ${buildAccordion("brand", "🏷️", "علامتك الشخصية", numBadge(P.A)+" "+numBadge(P.E), `
        <div class="mx-acc-body">
          <p class="mx-acc-lead">هويتك الجوهرية وكيف تُقدم نفسك للعالم بطريقة أصيلة</p>
          <div class="mx-acc-block mx-block-gold"><h5>طبيعتك الأصيلة: ${A.n}</h5><p>${A.core}</p><p>${A.real}</p></div>
          <div class="mx-acc-block"><h5>جوهرك الحقيقي: ${E.n}</h5><p>${E.core}</p></div>
          <div class="mx-acc-block mx-block-teal"><h5>رسالتك للعالم</h5><p>امزج بين ${A.n} و${E.n} في كل ما تُبدعه وتقدمه. هذا هو صوتك الحقيقي.</p></div>
        </div>`)}

      ${buildAccordion("health", "🌿", "الصحة والشاكرات", numBadge(P.A)+" "+numBadge(P.B)+" "+numBadge(P.E), chakraTable(P))}

      <div class="mx-compat-section">
        <h4 class="mx-compat-title">⚡ التوافق مع شخص</h4>
        ${compatSection(P)}
      </div>

    </div>`;

    root.innerHTML = head + svgWrap + sections + MX_NOTE + CONTACT_LINE;

    // ربط النقر على SVG
    root.querySelectorAll(".mx-node").forEach(node => {
      const sec = node.dataset.section;
      if (!sec) return;
      const handler = () => {
        const target = root.querySelector(`#mx-sec-${sec}`);
        if (!target) return;
        const btn = target.querySelector(".mx-acc-header");
        if (btn && btn.getAttribute("aria-expanded") === "false") btn.click();
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      node.addEventListener("click", handler);
      node.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handler(); } });
    });

    // ربط التوافق
    const mcGo = root.querySelector("#mc-go");
    if (mcGo) mcGo.addEventListener("click", () => {
      const er = root.querySelector("#mc-err"), out = root.querySelector("#mc-out"); er.hidden = true;
      const v = root.querySelector("#mc-date").value;
      if (!v) { er.textContent = "اكتب تاريخ ميلاد الشخص التاني."; er.hidden = false; return; }
      const [y2, m2, d2] = v.split("-").map(Number);
      if (y2 < 1900 || y2 > 2100) { er.textContent = "التاريخ لازم يكون بين 1900 و 2100."; er.hidden = false; return; }
      if (new Date(y2, m2 - 1, d2) > new Date()) { er.textContent = "تاريخ الميلاد ده في المستقبل. راجع التاريخ."; er.hidden = false; return; }
      out.innerHTML = compatHTML(P, matrixCalc(d2, m2, y2)); out.hidden = false;
    });

    // تحميل التحليل العميق من arcana JSON بشكل غير متزامن
    const deepLoaders = [
      { id: "#mx-personal-deep", nums: [P.A], posKey: "center" },
      { id: "#mx-karmic-deep", nums: [P.D], posKey: "karmicTail" },
      { id: "#mx-money-deep", nums: [P.G], posKey: "money" },
      { id: "#mx-relationships-deep", nums: [P.H], posKey: "relationships" },
      { id: "#mx-talents-deep", nums: [P.F], posKey: "center" },
      { id: "#mx-mission-deep", nums: [P.B], posKey: "mission" },
      { id: "#mx-attraction-deep", nums: [P.H], posKey: "relationships" }
    ];
    deepLoaders.forEach(async ({ id, nums, posKey }) => {
      const el = root.querySelector(id);
      if (!el) return;
      const n = nums[0];
      const data = await loadArcana(n);
      if (el && el.isConnected) el.innerHTML = arcanaSection(data, posKey);
    });

    const lpFill = $("#lp-date");
    if (lpFill && !lpFill.value) lpFill.value = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  

    // Auto-calculate on initial page load
    document.addEventListener("DOMContentLoaded", () => {
      const form = $("#mform");
      const runCalc = () => {
        const name = $("#m-name").value.trim();
        const dateVal = $("#m-date").value;
        if (!dateVal) return;
        const [y, m, d] = dateVal.split("-").map(Number);
        if (d && m && y) {
          renderMatrix(name, d, m, y);
        }
      };

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        runCalc();
      });

      // Run default calculation
      runCalc();
    });
  </script>
</body>
</html>
